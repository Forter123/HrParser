services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: hrparser
      POSTGRES_PASSWORD: hrparser
      POSTGRES_DB: hrparser
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrparser"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://hrparser:hrparser@db:5432/hrparser
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  pgdata:
